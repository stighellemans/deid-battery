# Smoke-test config: 12-doc slice, every runner that can run on this Mac, both
# metadata conditions, full post-process + eval + plot. Fast end-to-end check.
#   PYTHONPATH=.. <open-deid venv python> -m deid_battery.orchestrate run \
#       --config configs/battery.smoke.yaml
input: input.smoke.jsonl
output_dir: out_smoke
device: cpu

metadata:
  source: from_input          # oracle patient/caregiver names baked into input.smoke.jsonl

conditions:
  - {id: nometa, name: "no metadata", metadata: {source: none}}
  - {id: meta,   name: "with metadata"}

models:
  # model_commit pins an exact Hugging Face snapshot; base_model_commit pins the
  # exact base model used by a local checkpoint. Both values are Git commits.
  - id: belgian-deduce
    runner: deduce
    params: {engine: belgian-deduce}
  - id: deduce
    runner: deduce
    params: {engine: deduce}
  - id: gliner-pii
    runner: gliner
    params:
      model: urchade/gliner_multi_pii-v1
      model_commit: 1fcf13e85f4eef5394e1fcd406cf2ca9ea82351d
      threshold: 0.5
  - id: openai-privacy-filter
    runner: hf_token
    venv: .venv-pf
    params: {model: openai/privacy-filter, model_commit: 7ffa9a043d54d1be65afb281eddf0ffbe629385b}
  - id: openmed-multilingual
    runner: hf_token
    venv: .venv-pf
    params: {model: OpenMed/privacy-filter-multilingual, model_commit: f914f18d909d541d288dfda44a4d0b6bdb638d57}
  - id: uza
    runner: robbert
    params:
      checkpoint: models/uza/model.pt
      base_model: DTAI-KULeuven/robbert-2023-dutch-base
      base_model_commit: 1164b2df6d3ceb1735900c839da8de9bad1a99f9
      max_length: 512
      overlap: 64
      entity_labels: [Address_Location:Caregiver, Address_Location:Other, Address_Location:Patient,
                      Age_Birthdate, Contactdetails, Date, ID:Caregiver, ID:Patient, Name:Caregiver,
                      Name:Other, Name:Patient, Organization:Healthcare, Organization:Other,
                      Profession]
  - id: synthetic
    runner: robbert
    params:
      checkpoint: models/synthetic/best.pt
      base_model: DTAI-KULeuven/robbert-2023-dutch-base
      base_model_commit: 1164b2df6d3ceb1735900c839da8de9bad1a99f9
      max_length: 512
      overlap: 64
      # 14-label head (Stage-2 fulltrain-refit). Same label set as the uza model above.
      entity_labels: [Address_Location:Caregiver, Address_Location:Other, Address_Location:Patient,
                      Age_Birthdate, Contactdetails, Date, ID:Caregiver, ID:Patient, Name:Caregiver,
                      Name:Other, Name:Patient, Organization:Healthcare, Organization:Other,
                      Profession]

postprocess:
  enabled: true
  use_metadata: true
  rules: true
  inception: false

evaluate:
  enabled: true
  bundle: evaluation_bundle.smoke
  ignore_categories: [formatting, additional_info, medical_info, time, title]
  plot: core_pii_recall_non_pii_redaction.png
