# Hospital VM config: run the FULL battery on the established amd64 Linux host.
# The non-LLM systems run on CPU; Qwen uses the host's loopback-only GPU service.
# All 9 systems, both metadata conditions, post-process + eval + plot. Data stays
# on the approved hospital infrastructure.
#
# Data/model paths are relative to the repo root; Deidentify deliberately uses
# its established absolute venv path. Run every command from the repo root.
#
# One-time setup on the VM (from the repo root):
#   # 1) main + privacy-filter environments and belgian-deduce from git:
#   bash scripts/setup.sh --pf \
#       --deid-schema ../deid-schema \
#       --belgian-deduce "git+https://github.com/stighellemans/belgian-deduce.git@aeed6f27aef40bcdf4d6ddfa000cbfeb17bd6224"
#   # 2) dedicated legacy deidentify environment at the established hospital path:
#   bash scripts/setup_deidentify_venv.sh --deid-schema ../deid-schema /opt/.venv-deidentify
#   # 3) checkpoints: drop the two .pt files here (copied out-of-band; not in git):
#   #      models/uza/model.pt          (uza)
#   #      models/synthetic/best.pt     (synthetic)
#   mkdir -p models/uza models/synthetic
#   # 4) gold: put the gold files on the VM, then build the input (oracle metadata baked in):
#   #      - the corrected gold annotations.jsonl  -> builds input.jsonl
#   #      - the deid-eval-annotator bundle        -> ./evaluation_bundle/ (reference_items.jsonl + manifest.json)
#   .venv/bin/python scripts/build_input_from_gold.py --gold /path/to/annotations.jsonl --out input.jsonl
#
# Run:
#   .venv/bin/python -m deid_battery.orchestrate run --config configs/battery.vm.yaml
#
# Resume (after a Ctrl-C / OOM / disconnect -- inference is checkpointed per doc):
#   .venv/bin/python -m deid_battery.orchestrate run --config configs/battery.vm.yaml --skip-existing
#   Finished models are skipped; a mid-flight model continues from out/<model>/raw.partial.jsonl.
#   An incomplete model is excluded from eval with a warning until it's finished. Don't run two
#   processes against the same out/ at once.
#
# Outputs land in out/ : per-model by_doc spans, summary.csv, core_pii_recall_non_pii_redaction.png.
# Only summary.csv + the plot are score-only (no patient text) -> safe to copy off.
input: input.jsonl
output_dir: out
device: cpu                    # CPU is the intended, reproducible mode; no CUDA needed
# Per-method run times, recorded here after each run (device auto-labelled cpu/gpu).
# Hand-add rows for other hardware -- e.g. a GPU time measured elsewhere -- and they
# survive re-runs; a CPU run only ever updates the cpu `measured` row. Drives
# time_vs_recall.png. Kept out of out/ so hand-added rows aren't wiped.
timings: timings.yaml

metadata:
  source: from_input          # oracle patient/caregiver names baked into input.jsonl by the pre-step

conditions:
  - {id: nometa, name: "no metadata", metadata: {source: none}}
  - {id: meta,   name: "with metadata"}

models:
  - id: belgian-deduce
    runner: deduce
    params: {engine: belgian-deduce}
  - id: deduce
    runner: deduce
    params: {engine: deduce}
  - id: gliner-pii
    runner: gliner
    params:
      model: urchade/gliner_multi_pii-v1
      revision: 1fcf13e85f4eef5394e1fcd406cf2ca9ea82351d
      threshold: 0.5
  - id: openai-privacy-filter
    runner: hf_token
    venv: .venv-pf              # built by: scripts/setup.sh --pf
    params: {model: openai/privacy-filter, revision: 7ffa9a043d54d1be65afb281eddf0ffbe629385b}
  - id: openmed-multilingual
    runner: hf_token
    venv: .venv-pf
    params: {model: OpenMed/privacy-filter-multilingual, revision: f914f18d909d541d288dfda44a4d0b6bdb638d57}
  - id: uza
    runner: robbert
    params:
      checkpoint: models/uza/model.pt
      base_model: DTAI-KULeuven/robbert-2023-dutch-base
      base_revision: 1164b2df6d3ceb1735900c839da8de9bad1a99f9
      max_length: 512
      overlap: 64
      entity_labels: [Address_Location:Caregiver, Address_Location:Other, Address_Location:Patient,
                      Age_Birthdate, Contactdetails, Date, ID:Caregiver, ID:Patient, Name:Caregiver,
                      Name:Other, Name:Patient, Organization:Healthcare, Organization:Other,
                      Profession]
  - id: synthetic
    runner: robbert
    params:
      checkpoint: models/synthetic/best.pt
      base_model: DTAI-KULeuven/robbert-2023-dutch-base
      base_revision: 1164b2df6d3ceb1735900c839da8de9bad1a99f9
      max_length: 512
      overlap: 64
      # 14-label head: gold checkpoint trimmed 15->14 (retired subtype's slot dropped).
      # uza above stays 15 (that model will be replaced).
      entity_labels: [Address_Location:Caregiver, Address_Location:Other, Address_Location:Patient,
                      Age_Birthdate, Contactdetails, Date, ID:Caregiver, ID:Patient, Name:Caregiver,
                      Name:Other, Name:Patient, Organization:Healthcare, Organization:Other,
                      Profession]
  - id: deidentify
    runner: deidentify
    venv: /opt/.venv-deidentify # dedicated py3.9 amd64 environment (legacy 2020 stack)
    # max_chars windows long docs so one huge doc can't OOM the box (a 94 KB doc
    # spiked a 15 GB VM past its ceiling); overlap catches boundary entities.
    params: {model: model_bilstmcrf_ons_large-v0.2.0, chunk: 50, max_chars: 20000, overlap: 500}

  # Qwen — established OpenAI-compatible GPU service on the hospital host. Keep
  # the endpoint loopback-only; never tunnel patient text to a laptop/public API.
  # Generation settings match configs/battery.qwen.synthetic.yaml explicitly.
  - id: qwen3-8b
    runner: llm
    device_label: gpu
    params:
      base_url: http://127.0.0.1:11500/v1
      model: qwen3:8b-q4_K_M
      prompt_dir: prompts       # dict_prompt.txt, dict_example.txt, labels.csv
      temperature: 0.6
      top_p: 0.95
      thinking: true            # essential: much lower non-PII redaction than no-think
      max_tokens: 8000
      workers: 2

postprocess:
  enabled: true
  use_metadata: true
  rules: true
  inception: false              # INCEpTION-token normalization needs a JVM; leave off

evaluate:
  enabled: true
  bundle: evaluation_bundle     # the deid-eval-annotator gold bundle placed on the VM
  ignore_categories: [formatting, additional_info, medical_info, time, title]
  plot: core_pii_recall_non_pii_redaction.png
  plot_time_vs_recall: time_vs_recall.png   # run time vs recall (with metadata), dots coloured by device
