# Robustness-v2.2 CPU tranche. Neural/GPU methods run on the disposable Azure
# T4; UZA and synthetic are intentionally absent until the new model is ready.
input: input.jsonl
output_dir: out-v2.2
device: cpu
timings: timings.v2.2.yaml

metadata:
  source: from_input

conditions:
  - {id: nometa, name: "no metadata", metadata: {source: none}}
  - {id: meta, name: "with metadata"}

models:
  - id: belgian-deduce
    runner: deduce
    params: {engine: belgian-deduce}
  - id: deduce
    runner: deduce
    params: {engine: deduce}

postprocess:
  enabled: true
  use_metadata: true
  rules: true
  inception: false

evaluate:
  enabled: true
  bundle: evaluation_bundle
  ignore_categories: [formatting, additional_info, medical_info, time, title]
  plot: core_pii_recall_non_pii_redaction.png
  plot_time_vs_recall: time_vs_recall.png
