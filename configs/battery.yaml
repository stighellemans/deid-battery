# Canonical full-battery configuration. See docs/configuration.md for rationale
# and machine-specific examples.
input: input.jsonl

# Optional raw-export to battery-input mapping.
adapter:
  from: results.jsonl
  text_field: raw_text
  id_field: id
  metadata_fields:
    patient_first: patient_first_name
    patient_last: patient_last_name
    doc_date: date

output_dir: out
device: cpu
# Measured runtimes used by the time-versus-recall plot.
timings: timings.yaml

metadata:
  source: from_input

conditions:
  - { id: nometa, name: "no metadata", metadata: { source: none } }
  - { id: meta, name: "with metadata" }

models:
  # *_commit values pin exact Hugging Face snapshots; see the configuration docs.
  - id: belgian-deduce
    runner: deduce
    params: { engine: belgian-deduce }
  - id: deduce
    runner: deduce
    params: { engine: deduce }
  - id: gliner-pii
    runner: gliner
    params:
      model: urchade/gliner_multi_pii-v1
      model_commit: 1fcf13e85f4eef5394e1fcd406cf2ca9ea82351d
      threshold: 0.5
  - id: openai-privacy-filter
    runner: hf_token
    venv: .venv-pf
    params:
      model: openai/privacy-filter
      model_commit: 7ffa9a043d54d1be65afb281eddf0ffbe629385b
  - id: openmed-multilingual
    runner: hf_token
    venv: .venv-pf
    params:
      model: OpenMed/privacy-filter-multilingual
      model_commit: f914f18d909d541d288dfda44a4d0b6bdb638d57
  - id: uza
    runner: robbert
    params:
      checkpoint: models/uza/model.pt
      train_metrics: models/uza/train_metrics.json
      base_model: DTAI-KULeuven/robbert-2023-dutch-base
      base_model_commit: 1164b2df6d3ceb1735900c839da8de9bad1a99f9
      max_length: 512
      overlap: 64
  - id: synthetic
    runner: robbert
    params:
      checkpoint: models/synthetic/best.pt
      base_model: DTAI-KULeuven/robbert-2023-dutch-base
      base_model_commit: 1164b2df6d3ceb1735900c839da8de9bad1a99f9
      max_length: 512
      overlap: 64
      entity_labels:
        [
          Address_Location:Caregiver,
          Address_Location:Other,
          Address_Location:Patient,
          Age_Birthdate,
          Contactdetails,
          Date,
          ID:Caregiver,
          ID:Patient,
          Name:Caregiver,
          Name:Other,
          Name:Patient,
          Organization:Healthcare,
          Organization:Other,
          Profession,
        ]

  # Dedicated legacy runtime.
  - id: deidentify
    runner: deidentify
    venv: /opt/.venv-deidentify
    params:
      model: model_bilstmcrf_ons_large-v0.2.0
      device: cpu
      chunk: 50
      max_chars: 20000
      overlap: 500

  # OpenAI-compatible local service.
  - id: qwen3-8b
    runner: llm
    device_label: gpu
    params:
      base_url: http://127.0.0.1:11500/v1
      model: qwen3:8b  # GGUF Q4_K_M; verify/record digest separately
      prompt_dir: prompts
      temperature: 0.6
      top_p: 0.95
      thinking: true
      max_tokens: 8000
      workers: 2

postprocess:
  enabled: true
  use_metadata: true
  rules: true
  inception: false

evaluate:
  enabled: true
  bundle: evaluation_bundle
  ignore_categories: [formatting, additional_info, medical_info, time, title]
  plot: core_pii_recall_non_pii_redaction.png
  plot_time_vs_recall: time_vs_recall.png
  # Extra evidence about the shared substitution layer. This deliberately uses
  # gold Date/Age_Birthdate spans, so it measures transformation validity rather
  # than repeating model detection accuracy. A normal battery run generates it;
  # scripts/evaluate_pseudonymization.sh can regenerate it independently.
  pseudonymization:
    enabled: true
    output_dir: pseudonymization
    document_creation_date: "2025-01-15"
    date_shift_days: 371
    birthdate_replacement_mode: age
