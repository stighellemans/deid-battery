# The ONE canonical battery config: every system, both metadata conditions,
# shared post-processing, evaluation, and plots. Its defaults match the hospital
# deployment. Device, local Qwen endpoint, excluded models, and smoke-test paths
# are runtime choices; override them on the command line instead of copying YAML.
#
# Hospital (defaults):
#   .venv/bin/python -m deid_battery.orchestrate run --config configs/battery.yaml
#
# Apple Silicon local run (Deidentify's 2020 amd64 stack is unavailable):
#   .venv/bin/python -m deid_battery.orchestrate run --config configs/battery.yaml \
#     --device mps --exclude deidentify \
#     --llm-base-url http://127.0.0.1:11434/v1 --llm-model qwen3:8b
#
# Smoke subset:
#   .venv/bin/python -m deid_battery.orchestrate run --config configs/battery.yaml \
#     --input input.smoke.jsonl --output-dir out_smoke \
#     --evaluation-bundle evaluation_bundle.smoke --timings timings.smoke.yaml
#
# Build the input first (oracle metadata baked in), then run:
#   python scripts/build_input_from_gold.py \
#       --gold ../synthetic-deid-dataset/data/benchmark.v2.2.jsonl \
#       --out input.jsonl
#   PYTHONPATH=.. <open-deid venv python> -m deid_battery.orchestrate run \
#       --config configs/battery.yaml
input: input.jsonl

# Optional raw-export adapter, used only by `python -m deid_battery.inputs
# --config configs/battery.yaml`. It does not affect an existing input.jsonl.
adapter:
  from: results.jsonl
  text_field: raw_text
  id_field: id
  metadata_fields:
    patient_first: patient_first_name
    patient_last: patient_last_name
    doc_date: date

output_dir: out
device: cpu # portable default; use --device mps or --device cuda at runtime
# Per-method run times, recorded here after each run (device auto-labelled cpu/gpu).
# Hand-add rows for other hardware (e.g. a GPU time measured elsewhere) and they
# survive re-runs; a CPU run only ever updates the cpu `measured` row. Drives
# time_vs_recall.png. Kept out of out/ so hand-added rows aren't wiped.
timings: timings.yaml

metadata:
  source: from_input # oracle patient/caregiver names baked into input.jsonl

conditions:
  - { id: nometa, name: "no metadata", metadata: { source: none } }
  - { id: meta, name: "with metadata" }

models:
  # model_commit pins the exact Hugging Face model snapshot (a 40-character Git
  # commit); base_model_commit does the same for a checkpoint's base model.
  - id: belgian-deduce
    runner: deduce
    params: { engine: belgian-deduce }
  - id: deduce
    runner: deduce
    params: { engine: deduce }
  - id: gliner-pii
    runner: gliner
    params:
      model: urchade/gliner_multi_pii-v1
      model_commit: 1fcf13e85f4eef5394e1fcd406cf2ca9ea82351d
      threshold: 0.5
  - id: openai-privacy-filter
    runner: hf_token
    venv: .venv-pf
    params:
      model: openai/privacy-filter
      model_commit: 7ffa9a043d54d1be65afb281eddf0ffbe629385b
  - id: openmed-multilingual
    runner: hf_token
    venv: .venv-pf
    params:
      model: OpenMed/privacy-filter-multilingual
      model_commit: f914f18d909d541d288dfda44a4d0b6bdb638d57
  - id: uza
    runner: robbert
    params:
      checkpoint: models/uza/model.pt
      base_model: DTAI-KULeuven/robbert-2023-dutch-base
      base_model_commit: 1164b2df6d3ceb1735900c839da8de9bad1a99f9
      max_length: 512
      overlap: 64
      entity_labels:
        [
          Address_Location:Caregiver,
          Address_Location:Other,
          Address_Location:Patient,
          Age_Birthdate,
          Contactdetails,
          Date,
          ID:Caregiver,
          ID:Patient,
          Name:Caregiver,
          Name:Other,
          Name:Patient,
          Organization:Healthcare,
          Organization:Other,
          Profession,
        ]
  - id: synthetic
    runner: robbert
    params:
      checkpoint: models/synthetic/best.pt
      base_model: DTAI-KULeuven/robbert-2023-dutch-base
      base_model_commit: 1164b2df6d3ceb1735900c839da8de9bad1a99f9
      max_length: 512
      overlap: 64
      # 14-label head (Stage-2 fulltrain-refit). Same label set as the uza model above.
      entity_labels:
        [
          Address_Location:Caregiver,
          Address_Location:Other,
          Address_Location:Patient,
          Age_Birthdate,
          Contactdetails,
          Date,
          ID:Caregiver,
          ID:Patient,
          Name:Caregiver,
          Name:Other,
          Name:Patient,
          Organization:Healthcare,
          Organization:Other,
          Profession,
        ]

  # Deidentify requires this dedicated legacy py3.9/amd64 environment and about
  # 9 GB RAM. It cannot run on Apple Silicon; use `--exclude deidentify` there.
  - id: deidentify
    runner: deidentify
    venv: /opt/.venv-deidentify
    params:
      model: model_bilstmcrf_ons_large-v0.2.0
      device: cpu
      chunk: 50
      max_chars: 20000
      overlap: 500

  # Qwen runs behind an OpenAI-compatible service, so the global --device does
  # not control it. These are the hospital defaults; override URL/model locally.
  - id: qwen3-8b
    runner: llm
    device_label: gpu
    params:
      base_url: http://127.0.0.1:11500/v1
      model: qwen3:8b-q4_K_M
      prompt_dir: prompts
      temperature: 0.6
      top_p: 0.95
      thinking: true
      max_tokens: 8000
      workers: 2

postprocess:
  enabled: true
  use_metadata: true
  rules: true
  inception: false # INCEpTION-token normalization needs a JVM

evaluate:
  enabled: true
  bundle: evaluation_bundle # symlink -> ../deid-evaluation/evaluation_bundle (v2.2, 300-doc gold)
  ignore_categories: [formatting, additional_info, medical_info, time, title]
  plot: core_pii_recall_non_pii_redaction.png
  plot_time_vs_recall: time_vs_recall.png # run time vs recall (with metadata), dots coloured by device
